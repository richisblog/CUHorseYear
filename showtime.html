<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showtime | 2026 Horse Year Festival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Serif+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400&display=swap"
    rel="stylesheet">
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --bg-color: #F5EAE4;
      --brick-red: #8B2E1A;
      --accent-red: #A63C25;
      --charcoal: #2C2C2C;
      --white: #FFFFFF;
    }

    /* ===== Reset & Base ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', serif;
      background-color: var(--bg-color);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Decorative Background Image */
    .bg-decoration {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.9;
      pointer-events: none;
    }


    /* ===== Header & Navigation ===== */
    header {
      background: rgba(139, 46, 26, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 5px;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 500;
      transition: 0.3s;
      font-size: 0.9rem;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    /* Mobile Menu */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
    }

    .hamburger {
      width: 24px;
      height: 2px;
      background: white;
      position: relative;
    }

    .hamburger::before,
    .hamburger::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 2px;
      background: white;
      left: 0;
      transition: 0.3s;
    }

    .hamburger::before {
      top: -8px;
    }

    .hamburger::after {
      top: 8px;
    }

    /* ===== Main Content ===== */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
    }

    .showtime-poster-wrap {
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
    }

    .showtime-poster-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    /* Site Footer */
    footer {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 0.8rem;
    }

    /* ===== Responsiveness ===== */
    @media (max-width: 768px) {
      .bg-decoration {
        opacity: 0.4;
      }

      main {
        padding: 24px 16px 60px;
      }

      .showtime-poster-wrap {
        max-width: 100%;
      }
    }

    @media (max-width: 1024px) {
      .nav-links {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: rgba(139, 46, 26, 0.98);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transform: translateX(100%);
        transition: transform 0.4s;
        z-index: 999;
      }

      .nav-links.active {
        transform: translateX(0);
      }

      .nav-links a {
        font-size: 1.4rem;
        padding: 12px;
      }

      .menu-toggle {
        display: block;
        z-index: 1001;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="index.html" class="logo">CU Horse Year 2026</a>
      <button class="menu-toggle" id="mobile-menu" aria-label="Toggle Navigation">
        <div class="hamburger"></div>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="activities.html">Activities</a></li>
        <li><a href="foods.html">Food & Goods</a></li>
        <li><a href="showtime.html" class="active">Showtime</a></li>
      </ul>
    </nav>
  </header>

  <img src="photos/showtimebg.jpg" class="bg-decoration" alt="">

  <main>
    <div class="showtime-poster-wrap">
      <img src="photos/showtime.jpg" alt="2026 元宵庙会节目单 - 时间 2026年2月28日 4pm-8pm，地点 Davis Farmers Market">
    </div>
  </main>

  <footer>
    <p>&copy; 2026 CU Horse Year Festival. All Rights Reserved.</p>
  </footer>

  <script>
    // Mobile Menu Toggle
    const menuToggle = document.getElementById('mobile-menu');
    const navLinks = document.getElementById('nav-links');

    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        navLinks.classList.toggle('active');
      });
    }

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (menuToggle && navLinks && !menuToggle.contains(e.target) && !navLinks.contains(e.target)) {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
      }
    });
  </script>
</body>

</html>
