    header {
      background-color: var(--primary-color);
      color: white;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      text-decoration: none;
      color: white;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: var(--accent-color);
    }

    .nav-links a.active {
      border-bottom: 2px solid var(--accent-color);
    }

    .page-header {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 60px 20px;
      background-image: url('https://images.unsplash.com/photo-1473187983305-f615310e7daa?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
      background-size: cover;
      background-position: center;
      background-blend-mode: overlay;
    }

    .page-header h1 {
      font-size: 3rem;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .category-section {
      margin-bottom: 60px;
    }

    .section-title {
      text-align: center;
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
    }

    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-image-container {
      height: 200px;
      overflow: hidden;
      background-color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    .card-subtitle {
      font-size: 1rem;
      color: #666;
      margin-bottom: 15px;
    }

    .card-price {
      margin-top: auto;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    .loading-indicator {
      text-align: center;
      font-size: 1.2rem;
      color: #666;
      padding: 50px;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
    }
  </style>
</head>

    function renderProducts(categories) {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      categories.forEach(category => {
        const section = document.createElement('div');
        section.className = 'category-section';

        const title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = category.category;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid';

        category.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';

          let imageHtml = '';
          if (item.image) {
            imageHtml = `<img src="${item.image}" alt="${item.name}" loading="lazy">`;
          } else {
            // Placeholder if no image
            imageHtml = `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#adb5bd;">No Image</div>`;
          }

          const priceHtml = item.price ? `<div class="card-price">${item.price}</div>` : '';

          card.innerHTML = `
            <div class="card-image-container">
              ${imageHtml}
            </div>
            <div class="card-content">
              <div class="card-title">${item.name}</div>
              <div class="card-subtitle">${item.chinese_name || ''}</div>
              ${priceHtml}
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      });
    }

    // Call renderProducts directly with the synced data
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts(productsData);
    });
  </script>
